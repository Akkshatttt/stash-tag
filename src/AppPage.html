<!DOCTYPE html>
<html>
<head>
<base target="_top">
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  body { font: 16px -apple-system, system-ui, sans-serif; background: #fafafa; margin: 0; padding: 12px; color: #222; }
  .tabs { display: flex; gap: 6px; margin-bottom: 12px; }
  .tabs button { flex: 1; padding: 10px; border: 1px solid #ccc; background: #fff; border-radius: 8px; font-size: 16px; }
  .tabs button.on { background: #222; color: #fff; }
  .card { background: #fff; border-radius: 12px; box-shadow: 0 1px 3px rgba(0,0,0,.15); padding: 12px; margin-bottom: 12px; }
  label { display: block; font-size: 13px; color: #666; margin-top: 8px; }
  input, select { width: 100%; box-sizing: border-box; padding: 10px; font-size: 16px; border: 1px solid #ccc; border-radius: 8px; }
  button.primary { width: 100%; padding: 12px; margin-top: 12px; background: #1e8e3e; color: #fff; border: 0; border-radius: 8px; font-size: 16px; }
  button.sec { width: 100%; padding: 12px; margin-top: 8px; background: #1a73e8; color: #fff; border: 0; border-radius: 8px; font-size: 16px; }
  .good { color: #1e8e3e; } .warn { color: #b06000; } .bad { color: #c5221f; }
  .small { font-size: 13px; color: #666; } .big { font-size: 18px; font-weight: 600; }
  .live { display: none; position: fixed; inset: 0; z-index: 10; background: #fff; padding: 12px; overflow: auto; }
  .live video { width: 100%; max-height: 50vh; background: #000; border-radius: 8px; object-fit: cover; }
  .row { display: flex; justify-content: space-between; gap: 8px; }
</style>
</head>
<body>
<div class="tabs"><button id="t1">Add stock</button><button id="t2">Search</button></div>
<div id="live" class="live"></div>
<div id="app"></div>
<script src="https://unpkg.com/@zxing/library@0.21.3/umd/index.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/zxing-wasm@3.1.6/dist/iife/reader/index.js"></script>
<script><?!= lib ?></script>
<script>
var TOKEN = <?!= JSON.stringify(token) ?>;
var CATEGORIES = <?!= JSON.stringify(categories) ?>;
var tab = 'add', busy = false;
// The whole inventory is fetched once (background) and searched here, so Search and the 'already in stock' hint cost no server call.
function loadInv() {
  google.script.run.withSuccessHandler(function (r) { st.inv = r.rows; render(); })
    .withFailureHandler(function (e) { st.msg = 'Error: ' + (e && e.message || e); render(); }).invCall(TOKEN, { action: 'load' });
}
function stocked(rec) { return (st.inv || []).filter(function (r) { return r.category === rec.category && r.groupKey === rec.groupKey; })[0] || null; }
var st = { scan: null, msg: '', inv: null };       // last server answers
var ui = { text: '', qty: '', location: '', category: '', lot: '', query: '' };   // what the user typed; typing never redraws (keeps the phone keyboard open)

function el(tag, props, kids) {
  var e = document.createElement(tag);
  Object.keys(props || {}).forEach(function (k) { if (k === 'text') e.textContent = props[k]; else e[k] = props[k]; });
  (kids || []).forEach(function (c) { if (c) e.appendChild(c); });
  return e;
}
function field(label, key, props) {
  var i = el('input', Object.assign({ value: ui[key] }, props || {}));
  i.addEventListener('input', function () { ui[key] = i.value; });
  return el('div', {}, [el('label', { text: label }), i]);
}

function call(req, cb) {
  if (busy) return;
  busy = true; st.msg = ''; render();
  google.script.run
    .withSuccessHandler(function (r) { busy = false; cb(r); render(); })
    .withFailureHandler(function (e) { busy = false; st.msg = 'Error: ' + (e && e.message || e); render(); })
    .invCall(TOKEN, req);
}

// ---- barcode decoding. zxing-wasm (CDN) does the work: perspective, glare, several symbols per photo, full resolution. ZXing-js passes in
// makeDecoder_ (Decode.js) are the fallback if the WebAssembly build cannot load in this page.
var wasmFailed = false;
function toImageData(src, w, h, maxSide) {   // photo or video frame -> RGBA, keeping as much resolution as asked
  var s = Math.min(1, maxSide / Math.max(w, h)), c = document.createElement('canvas');
  c.width = Math.round(w * s); c.height = Math.round(h * s);
  var g = c.getContext('2d', { willReadFrequently: true }); g.drawImage(src, 0, 0, c.width, c.height);
  return g.getImageData(0, 0, c.width, c.height);
}
function decodeImageData(id, fast, done) {   // done(array of every barcode text found)
  var texts = function (rs) { return rs.map(function (r) { return r.text; }); };
  var js = function () {
    try { var d = makeDecoder_(ZXing); done(texts(d.decodeAll(d.gray(id.data, id.width, id.height), { fast: fast, budgetMs: fast ? 600 : 4000 }))); } catch (e) { done([]); }
  };
  if (typeof ZXingWASM === 'undefined' || wasmFailed) return js();
  decodeWasm_(ZXingWASM, id, fast).then(function (rs) { if (rs.length || fast) done(texts(rs)); else js(); },
    function (e) { wasmFailed = true; st.wasmError = String(e && e.message || e); js(); });
}
function decodeFile(file, done) {
  var url = URL.createObjectURL(file), img = new Image();
  img.onload = function () { var id = toImageData(img, img.width, img.height, 3000); URL.revokeObjectURL(url); decodeImageData(id, false, done); };
  img.onerror = function () { done([]); };
  img.src = url;
}

function applyScan(r) {   // a scan answer becomes the part card (typed, photo and live scans all end here)
  st.scan = r;
  if (r.rec) { ui.qty = r.parsed.qty ? String(r.parsed.qty) : ''; var ex = stocked(r.rec); ui.location = (ex && ex.location.split(' / ')[0]) || ''; ui.category = r.rec.category; ui.lot = r.parsed.lot || ''; }
}
function doScan(text) {   // text: typed string, or the array of every barcode read from a photo
  var many = Array.isArray(text);
  ui.text = many ? '' : text; ui.qty = ''; ui.location = ''; ui.lot = '';
  call(many ? { action: 'scan', texts: text } : { action: 'scan', text: text }, applyScan);
}

// ---- live camera: a full-screen overlay reads frames until a part resolves, then asks the user to confirm before the normal part card shows.
var live = null;
function liveBox() { return document.getElementById('live'); }
function stopLive() {
  if (!live) return;
  live.stop = true; live.stream.getTracks().forEach(function (t) { t.stop(); }); live = null;
  var b = liveBox(); b.innerHTML = ''; b.style.display = 'none';
}
function startLive() {
  if (typeof navigator === 'undefined' || !navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) { st.msg = 'Error: live camera is not available here. Use the photo button.'; return render(); }
  navigator.mediaDevices.getUserMedia({ video: { facingMode: { ideal: 'environment' }, width: { ideal: 1920 }, height: { ideal: 1080 } }, audio: false }).then(function (stream) {
    var video = el('video', { autoplay: true, muted: true }), status = el('div', { className: 'small', text: 'Point at the label. Reading...' }), popup = el('div', {});
    video.setAttribute('playsinline', ''); video.srcObject = stream;
    var close = el('button', { className: 'sec', text: 'Close camera' }); close.addEventListener('click', function () { stopLive(); render(); });
    var box = liveBox(); box.innerHTML = ''; box.style.display = 'block';
    [el('div', { className: 'big', text: 'Live scan' }), video, status, popup, close].forEach(function (c) { box.appendChild(c); });
    live = { stream: stream, video: video, status: status, popup: popup, seen: {}, firstAt: 0, asking: false, paused: false, stop: false };
    if (video.play) video.play();
    liveTick();
  }, function (e) { st.msg = 'Error: live camera blocked (' + (e && e.name) + ': ' + (e && e.message) + '). Use the photo button.'; render(); });
}
function liveReset(msg) { live.seen = {}; live.firstAt = 0; live.asking = false; live.paused = false; live.popup.innerHTML = ''; if (msg) live.status.textContent = msg; }
function liveTick() {
  var l = live;
  if (!l || l.stop) return;
  var v = l.video, next = function () { setTimeout(liveTick, 120); };
  if (l.paused || l.asking || !v.videoWidth) return next();
  decodeImageData(toImageData(v, v.videoWidth, v.videoHeight, 1280), true, function (texts) {
    if (l.stop) return;
    texts.forEach(function (t) { l.seen[t] = 1; });
    var n = Object.keys(l.seen).length, now = Date.now();
    if (n && !l.firstAt) l.firstAt = now;
    if (n && now - l.firstAt > 900) return liveAsk(next);   // collect about a second so every bar on the label is in
    next();
  });
}
function liveAsk(next) {
  var l = live, texts = Object.keys(l.seen);
  l.asking = true; l.status.textContent = 'Read ' + texts.length + ' barcode(s). Looking up...';
  google.script.run.withSuccessHandler(function (r) {
    if (!live || live.stop) return;
    l.asking = false;
    if (!r.rec) { liveReset('Read ' + texts.length + ' barcode(s), no part found' + (r.warnings && r.warnings[0] ? ': ' + r.warnings[0] : '') + '. Keep aiming.'); return next(); }
    l.paused = true; l.status.textContent = 'Part detected.';
    var use = el('button', { className: 'primary', text: 'Use this part' }), no = el('button', { className: 'sec', text: 'Not this one' });
    use.addEventListener('click', function () { stopLive(); ui.text = ''; applyScan(r); st.msg = ''; render(); });
    no.addEventListener('click', function () { liveReset('Point at the label. Reading...'); next(); });
    l.popup.innerHTML = '';
    l.popup.appendChild(el('div', { className: 'card' }, [el('div', { className: 'big', text: r.rec.mpn }),
      el('div', { className: 'small', text: [r.rec.manufacturer, r.rec.supplier, r.rec.dkPn || r.rec.mouserPn].filter(Boolean).join(' · ') }),
      el('div', { text: r.rec.description }), r.parsed && r.parsed.qty ? el('div', { className: 'small', text: 'Quantity on label: ' + r.parsed.qty }) : null, use, no]));
  }).withFailureHandler(function (e) { if (!live) return; liveReset('Error: ' + (e && e.message || e)); next(); }).invCall(TOKEN, { action: 'scan', texts: texts });
}

function patchInv(row) {
  if (!st.inv) return;
  var i = st.inv.findIndex(function (x) { return x.category === row.category && x.groupKey === row.groupKey; });
  if (i >= 0) st.inv[i] = row; else st.inv.push(row);
}

function stockLine(r) {
  if (!st.inv) return el('div', { className: 'small', text: 'Checking stock...' });
  var ex = stocked(Object.assign({}, r, { category: ui.category }));
  return ex ? el('div', { className: 'warn', text: 'Already in stock: ' + ex.qty + (ex.location ? ' at ' + ex.location : '') }) : el('div', { className: 'good', text: 'New group' });
}

function addView() {
  var root = el('div', {});
  var cam = el('input', { type: 'file', accept: 'image/*' });
  cam.setAttribute('capture', 'environment');
  cam.style.display = 'none';
  cam.addEventListener('change', function () {
    if (!cam.files[0]) return;
    st.msg = 'Reading barcodes...'; render();
    decodeFile(cam.files[0], function (t) {
      if (t.length) { st.msg = ''; doScan(t); } else { st.msg = 'No barcode found. Try again, or type the part number below.' + (st.wasmError ? ' (decoder: ' + st.wasmError + ')' : ''); render(); }
    });
  });
  var snap = el('button', { className: 'primary', text: 'Scan label (take photo)', disabled: busy });
  snap.addEventListener('click', function () { cam.value = ''; cam.click(); });
  var liveBtn = el('button', { className: 'sec', text: 'Live scan (camera)', disabled: busy });
  liveBtn.addEventListener('click', startLive);
  root.appendChild(el('div', { className: 'card' }, [cam, snap, liveBtn, field('...or type / paste a part number or barcode text', 'text', { placeholder: 'e.g. AC0402FR-072K2L' }),
    (function () { var b = el('button', { className: 'sec', text: 'Look up', disabled: busy }); b.addEventListener('click', function () { if (ui.text) doScan(ui.text); }); return b; })()]));
  var s = st.scan;
  if (s && !s.rec) {
    var p = s.parsed || {}, shown = String(p.raw || '').replace(/\x1d/g, '<GS>').replace(/\x1e/g, '<RS>').replace(/\x04/g, '<EOT>');
    root.appendChild(el('div', { className: 'card' }, [el('div', { className: 'bad', text: 'Part not found.' })].concat((s.warnings || []).map(function (w) { return el('div', { className: 'small', text: w }); }),
      [el('div', { className: 'small', text: 'Decoded: ' + shown }), el('div', { className: 'small', text: 'Fields: ' + JSON.stringify(p.fields || {}) + ' | searched: ' + (p.supplierPn || p.mpn || '(none)') })])));
  }
  if (s && s.rec) {
    var r = s.rec, sel = el('select', {}, CATEGORIES.map(function (c) { return el('option', { value: c, text: c, selected: c === ui.category }); }));
    sel.addEventListener('change', function () { ui.category = sel.value; });
    var add = el('button', { className: 'primary', text: 'Add to stock', disabled: busy });
    add.addEventListener('click', function () {
      var rec = Object.assign({}, r, { category: ui.category });
      call({ action: 'confirm', rec: rec, qty: ui.qty, location: ui.location, lot: ui.lot }, function (res) {
        patchInv(res.row);
        st.scan = null; st.msg = (res.isNew ? 'New row: ' : 'Updated: ') + res.row.value + ' ' + res.row.package + ' ' + (res.row.mpns.split(', ')[0] || '') + ' now ' + res.row.qty + ' in ' + res.row.category;
        ui.text = ''; ui.qty = ''; ui.location = '';
      });
    });
    root.appendChild(el('div', { className: 'card' }, [
      el('div', { className: 'big', text: r.mpn }),
      el('div', { className: 'small', text: [r.manufacturer, r.supplier + (s.source === 'cache' ? ' (cached)' : ''), r.dkPn || r.mouserPn].filter(Boolean).join(' · ') }),
      el('div', { text: r.description }),
      el('div', { className: 'small', text: ['Group: ' + r.groupKey, r.spec].filter(Boolean).join(' · ') }),
      stockLine(r),
      el('label', { text: 'Sheet' }), sel,
      field('Quantity added', 'qty', { type: 'number', inputMode: 'numeric', placeholder: 'how many' }),
      field('Location', 'location', { placeholder: 'e.g. A1 or 1-12' }),
      field('Lot', 'lot', {}),
      add
    ].concat((s.warnings || []).map(function (w) { return el('div', { className: 'small warn', text: w }); }))));
  }
  return root;
}

function searchView() {
  var root = el('div', {}), out = el('div', {});
  var draw = function () {
    out.innerHTML = '';
    if (!st.inv) return out.appendChild(el('div', { className: 'small', text: 'Loading inventory...' }));
    var hits = searchRows_(st.inv, ui.query, 100);
    hits.forEach(function (x) {
      out.appendChild(el('div', { className: 'card' }, [
        el('div', { className: 'row' }, [el('span', { className: 'big', text: [x.value, x.package].filter(Boolean).join(' ') || x.mpns.split(', ')[0] }), el('span', { className: 'big', text: String(x.qty) })]),
        el('div', { className: 'small', text: [x.category, x.spec, x.location && ('@ ' + x.location)].filter(Boolean).join(' · ') }),
        el('div', { text: x.description }),
        el('div', { className: 'small', text: x.mpns })
      ]));
    });
    if (!hits.length) out.appendChild(el('div', { className: 'small', text: 'Nothing matched.' }));
  };
  var box = field('Words must all match, e.g. 0402 20k or 100nF X7R', 'query', { placeholder: 'search inventory' });
  box.children[1].addEventListener('input', draw);   // redraws only the result list, so the phone keyboard stays open
  root.appendChild(el('div', { className: 'card' }, [box]));
  draw();
  root.appendChild(out);
  return root;
}

function render() {
  t1.className = tab === 'add' ? 'on' : ''; t2.className = tab === 'search' ? 'on' : '';
  var app = document.getElementById('app');
  app.innerHTML = '';
  if (st.msg) app.appendChild(el('div', { className: 'card ' + (/^Error|not found|No barcode/.test(st.msg) ? 'bad' : 'good'), text: st.msg }));
  if (busy) app.appendChild(el('div', { className: 'small', text: 'Working...' }));
  app.appendChild(tab === 'add' ? addView() : searchView());
}
var t1 = document.getElementById('t1'), t2 = document.getElementById('t2');
loadInv();
t1.onclick = function () { tab = 'add'; render(); };
t2.onclick = function () { tab = 'search'; render(); };
render();
</script>
</body>
</html>
