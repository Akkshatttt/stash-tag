    el('div', { className: 'small', text: [c.mfr, c.dkpn, c.mopn, c.src === 1 ? 'DigiKey' : c.src === 2 ? 'Mouser' : 'other'].filter(Boolean).join(' · ') }), el('div', { text: c.descr }),
    el('div', { className: 'small', text: c.by ? 'Last change: ' + c.by + ' ' + fmtDate(c.ts) : 'No changes yet' })];
  var ed = el('button', { className: 'pill', text: 'Edit' }); ed.addEventListener('click', function () { toggle('e' + c.id); });
  kids.push(el('div', { className: 'row2' }, [ed]));
  if (st.open['e' + c.id]) kids.push(editBox(c, function () { st.open['e' + c.id] = false; st.redraw(); }));
  if (!c.packets.length) kids.push(el('div', { className: 'small', text: 'No packets in stock.' }));
  c.packets.forEach(function (p) {
    var b = el('button', { className: 'pill', text: 'Change' }); b.addEventListener('click', function () { toggle('p' + p.id); });
    kids.push(el('div', { className: 'row2' }, [el('span', { className: 'sub', text: packetLine(p) }), b]));
    if (st.open['p' + p.id]) kids.push(txnBox(p, function () { st.open['p' + p.id] = false; st.redraw(); }));
  });
  return el('div', { className: 'kid' }, kids);
}

// ---- Count tab: cycle count of one box; differences are logged as corrections
function countView() {
  var root = el('div', {});
  if (!st.inv) return el('div', { className: 'foot', text: 'Loading inventory...' });
  var sel = boxSelect(ui.countBox === '-' ? null : ui.countBox, [['-', 'Choose a box...']]);
  sel.value = ui.countBox; sel.addEventListener('change', function () { ui.countBox = sel.value; ui.counts = {}; render(); });
  root.appendChild(el('div', { className: 'group' }, [el('div', { className: 'cell' }, [el('span', { className: 'cl', text: 'Box' }), sel])]));
  if (ui.countBox === '-') return (root.appendChild(el('div', { className: 'foot', text: 'Pick a box, then type what is really in each packet.' })), root);
  var packets = [];
  st.inv.groups.forEach(function (g) { g.comps.forEach(function (c) { c.packets.forEach(function (p) { if (String(p.box || '') === ui.countBox) packets.push({ c: c, p: p }); }); }); });
  if (!packets.length) root.appendChild(el('div', { className: 'foot', text: 'No packets in this box.' }));
  root.appendChild(el('div', { className: 'group' }, packets.map(function (x) {
    var i = el('input', { type: 'number', inputMode: 'numeric', value: String(ui.counts[x.p.id] != null ? ui.counts[x.p.id] : x.p.qty) });
    i.addEventListener('input', function () { ui.counts[x.p.id] = i.value; });
    return el('div', { className: 'cell' }, [el('div', {}, [el('div', { text: x.c.mpn }), el('div', { className: 'small', text: 'recorded ' + x.p.qty })]), i]);
  })));
  if (packets.length) {
    var save = el('button', { className: 'primary', text: 'Save counts', disabled: busy });
    save.addEventListener('click', function () {
      if (!ui.who) { st.msg = 'Error: enter your name first (bottom of the Scan tab).'; return render(); }
      var items = packets.map(function (x) { return { packet: x.p.id, counted: ui.counts[x.p.id] != null ? ui.counts[x.p.id] : x.p.qty }; });
      var changed = items.filter(function (it, k) { return +it.counted !== packets[k].p.qty; }).length;
      call({ action: 'inv_audit', items: items }, function (r) { r.comps.forEach(function (c) { if (c) patchGroup(c.group); }); ui.counts = {}; st.msg = 'Counted ' + items.length + ' packet(s), ' + changed + ' corrected.'; });
    });
    root.appendChild(save);
  }
  return root;
}

function render() {
  t1.className = tab === 'scan' ? 'on' : ''; t2.className = tab === 'search' ? 'on' : ''; t3.className = tab === 'count' ? 'on' : '';
  var app = document.getElementById('app');
  app.innerHTML = '';
  if (signedIn()) app.appendChild(el('div', { className: 'title', text: tab === 'scan' ? 'Scan' : tab === 'search' ? 'Search' : 'Count' }));
  if (st.msg) app.appendChild(el('div', { className: 'card ' + (/^Error|not found|No barcode/.test(st.msg) ? 'bad' : 'good'), text: st.msg }));
  if (!signedIn()) return app.appendChild(loginView());
  app.appendChild(tab === 'scan' ? addView() : tab === 'search' ? searchView() : countView());
}
var t1 = document.getElementById('t1'), t2 = document.getElementById('t2'), t3 = document.getElementById('t3');
if (signedIn() && store('inv2')) setInv(store('inv2'));
loadInv();
if (ui.dbg) loadUsage();
t1.onclick = function () { tab = 'scan'; render(); };
t2.onclick = function () { tab = 'search'; render(); };
t3.onclick = function () { tab = 'count'; render(); };
render();
</script>
</body>
