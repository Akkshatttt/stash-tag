    el('div', { className: 'meta', text: c.by ? 'Last change: ' + c.by + ' ' + fmtDate(c.ts) : 'No changes yet' })];
  kids.push(el('div', { className: 'row2' }, [B('Edit part', 'pill', function () { toggle('e' + c.id); })]));
  if (st.open['e' + c.id]) kids.push(editBox(c, g, function (msg) { st.open['e' + c.id] = false; flash(msg, 'good'); }));
  if (!c.packets.length) kids.push(el('div', { className: 'meta', text: 'No packets in stock.' }));
  c.packets.forEach(function (p) {
    kids.push(el('div', { className: 'pk' }, [el('span', { text: packetLine(p) }), B('Edit packet', 'pill', function () { toggle('p' + p.id); })]));
    if (st.open['p' + p.id]) kids.push(el('div', { className: 'form' }, [txnBox(p, c.mpn, function (msg) { st.open['p' + p.id] = false; flash(msg, 'good'); })]));
  });
  return el('div', { className: 'kid' }, kids);
}

// ---- the Scan page: one place, two jobs. Add stock = a new packet; Update stock = take, add, set the count of or move a packet that is already in stock.
function seg() {
  return el('div', { className: 'seg' }, [['add', 'Add stock'], ['upd', 'Update stock']].map(function (m) {
    return B(m[1], 'seg-b' + (ui.mode === m[0] ? ' on' : ''), function () { if (ui.mode !== m[0]) { setMode(m[0]); render(); } });
  }));
}
function scanPage() { return el('div', {}, [seg(), ui.mode === 'upd' ? txView() : addView()]); }

// ---- Count tab: cycle count of one box; differences are logged as corrections
function countView() {   // not reachable from the tab bar while the Count tab is hidden (set tab = 'count' to bring it back)
  var root = el('div', {});
  if (!st.inv) return el('div', { className: 'foot', text: 'Loading inventory...' });
  var sel = boxSelect(ui.countBox === '-' ? '' : ui.countBox, 'Choose a box...');
  sel.addEventListener('change', function () { ui.countBox = sel.value || '-'; ui.counts = {}; render(); });
  root.appendChild(el('div', { className: 'form' }, [field('Box to count', sel)]));
  if (ui.countBox === '-') return (root.appendChild(el('div', { className: 'foot', text: 'Pick a box, then type what is really in each packet.' })), root);
  var packets = [];
  st.inv.groups.forEach(function (g) { g.comps.forEach(function (c) { c.packets.forEach(function (p) { if (String(p.box || '') === ui.countBox) packets.push({ c: c, p: p }); }); }); });
  if (!packets.length) root.appendChild(el('div', { className: 'foot', text: 'No packets in this box.' }));
  root.appendChild(el('div', { className: 'form' }, packets.map(function (x) {
    var i = el('input', { type: 'number', inputMode: 'numeric', value: String(ui.counts[x.p.id] != null ? ui.counts[x.p.id] : x.p.qty) });
    i.addEventListener('input', function () { ui.counts[x.p.id] = i.value; });
    return field(x.c.mpn + ' (recorded ' + x.p.qty + ')', i);
  })));
  if (packets.length) {
    root.appendChild(B('Save counts', 'primary', function (b) {
      if (needName()) return;
      var items = packets.map(function (x) { return { packet: x.p.id, counted: ui.counts[x.p.id] != null ? ui.counts[x.p.id] : x.p.qty }; });
      var changed = items.filter(function (it, k) { return +it.counted !== packets[k].p.qty; }).length;
      run({ action: 'inv_audit', items: items }, function (r) { r.comps.forEach(function (c) { if (c) patchGroup(c.group); }); ui.counts = {}; flash('Counted ' + items.length + ' packet(s), ' + changed + ' corrected.', 'good'); }, { btn: b, label: 'Saving counts...' });
    }));
  }
  return root;
}

function render() {
  reg = [];
  [[t1, 'scan'], [t2, 'search']].forEach(function (x) { x[0].className = tab === x[1] ? 'on' : ''; x[0].disabled = busy; });
  var app = document.getElementById('app');
  app.innerHTML = '';
  app.className = 'mode-' + (tab === 'scan' ? ui.mode : 'add');   // update mode wears a different accent colour
  paintBanner();
  if (signedIn()) app.appendChild(el('div', { className: 'title', text: tab === 'scan' ? (ui.mode === 'upd' ? 'Update stock' : 'Add stock') : { search: 'Search', count: 'Count' }[tab] }));
  if (!signedIn()) return app.appendChild(loginView());
  app.appendChild({ scan: scanPage, search: searchView, count: countView }[tab]());
}
var t1 = document.getElementById('t1'), t2 = document.getElementById('t2');
if (signedIn() && store('inv2')) setInv(store('inv2'));
loadInv();
if (ui.dbg) loadUsage();
[[t1, 'scan'], [t2, 'search']].forEach(function (x) { x[0].onclick = function () { if (busy) return; tab = x[1]; render(); }; });
render();
</script>
</body>
</html>
