      if (t.length) { st.msg = ''; doScan(t); } else { st.msg = 'No barcode found. Try again, or type the part number below.' + (st.wasmError ? ' (decoder: ' + st.wasmError + ')' : ''); render(); }
    });
  });
  var s = st.scan;
  if (st.pick && st.pick.length) {
    root.appendChild(el('div', { className: 'group' }, st.pick.map(function (t) {
      var b = el('button', { className: 'link', text: t, disabled: busy }); b.addEventListener('click', function () { pickScan(st.pickFrom || [], t); });
      return el('div', { className: 'cell left' }, [b]);
    })));
    root.appendChild(el('div', { className: 'foot', text: 'Which barcode is the part number? Tap it. A Mouser part number looks like 595-XXXX.' }));
  }
  if (s && !s.rec) {
    var p = s.parsed || {}, shown = String(p.raw || '').replace(/\x1d/g, '<GS>').replace(/\x1e/g, '<RS>').replace(/\x04/g, '<EOT>');
    root.appendChild(el('div', { className: 'card' }, [el('div', { className: 'bad big', text: 'Part not found' })].concat((s.warnings || []).map(function (w) { return el('div', { className: 'sub', text: w }); }),
      [el('div', { className: 'small', text: 'Decoded: ' + shown }), el('div', { className: 'small', text: 'Fields: ' + JSON.stringify(p.fields || {}) + ' | searched: ' + (p.supplierPn || p.mpn || '(none)') })])));
  }
  if (s && s.rec) {
    var r = s.rec, sel = el('select', {}, CATEGORIES.map(function (c) { return el('option', { value: c, text: c, selected: c === ui.category }); }));
    sel.addEventListener('change', function () { ui.category = sel.value; });
    var add = el('button', { className: 'primary', text: busy ? 'Adding...' : 'Add to stock', disabled: busy });
    add.addEventListener('click', function () {
      var rec = Object.assign({}, r, { category: ui.category });
      call({ action: 'confirm', rec: rec, qty: ui.qty, location: ui.location, lot: ui.lot }, function (res) {
        patchInv(res.row);
        st.scan = null; st.msg = (res.isNew ? 'New row: ' : 'Updated: ') + res.row.value + ' ' + res.row.package + ' ' + (res.row.mpns.split(', ')[0] || '') + ' now ' + res.row.qty + ' in ' + res.row.category;
        ui.text = ''; ui.qty = ''; ui.location = '';
      });
    });
    var frow = function (label, key, props) { var i = el('input', Object.assign({ value: ui[key] }, props || {})); i.addEventListener('input', function () { ui[key] = i.value; }); return el('div', { className: 'cell' }, [el('span', { className: 'cl', text: label }), i]); };
    root.appendChild(el('div', { className: 'group' }, [el('div', { className: 'pad' }, [
      el('div', { className: 'big', text: r.mpn }),
      s.parsed && s.parsed.loose ? el('div', { className: 'small warn', text: 'Unverified: guessed from a bar on the label. Check it against the packet.' }) : null,
      el('div', { className: 'sub', text: [r.manufacturer, r.supplier + (s.source === 'cache' || s.source === 'cloud cache' ? ' (cached)' : ''), r.dkPn || r.mouserPn].filter(Boolean).join(' · ') }),
      el('div', { text: r.description }),
      el('div', { className: 'small', text: ['Group: ' + r.groupKey, r.spec].filter(Boolean).join(' · ') }),
      stockLine(r)])]));
    root.appendChild(el('div', { className: 'group' }, [
      el('div', { className: 'cell' }, [el('span', { className: 'cl', text: 'Sheet' }), sel]),
      frow('Quantity added', 'qty', { type: 'number', inputMode: 'numeric', placeholder: 'how many' }),
      frow('Location', 'location', { placeholder: 'e.g. A1' }),
      frow('Lot', 'lot', { placeholder: 'optional' })]));
    (s.warnings || []).forEach(function (w) { root.appendChild(el('div', { className: 'foot warn', text: w })); });
    root.appendChild(add);
  }
  var snap = el('button', { className: s && s.rec ? 'sec' : 'primary', text: s && s.rec ? 'Scan another' : 'Live scan', disabled: busy });
  snap.addEventListener('click', startLive);
  var photo = el('button', { className: 'sec', text: 'Take photo', disabled: busy });
  photo.addEventListener('click', function () { cam.value = ''; cam.click(); });
  var typed = el('input', { value: ui.text, placeholder: 'Type or paste a part number' });
  typed.addEventListener('input', function () { ui.text = typed.value; });
  var go = el('button', { className: 'link', text: 'Look up', disabled: busy });
  go.addEventListener('click', function () { if (ui.text) doScan(ui.text); });
  root.appendChild(cam); root.appendChild(snap); root.appendChild(photo);
  root.appendChild(el('div', { className: 'group' }, [el('div', { className: 'cell left' }, [typed, go])]));
  root.appendChild(el('div', { className: 'foot', text: 'DigiKey and Mouser labels are recognised automatically.' }));
  var dbgBtn = el('button', { className: 'link', text: ui.dbg ? 'Hide debug info' : 'Show debug info' });
  dbgBtn.addEventListener('click', function () { ui.dbg = !ui.dbg; store('debug', ui.dbg); render(); });
  root.appendChild(dbgBtn);
  if (ui.dbg) root.appendChild(el('div', { className: 'small', text: dbgText() }));
  return root;
}

function searchView() {
  var root = el('div', {}), out = el('div', {}), chipBox = el('div', { className: 'chips' });
  var count = el('div', { className: 'small' });
  var drawChips = function () {
    chipBox.innerHTML = '';
    [''].concat(CATEGORIES).forEach(function (c) {
      var b = el('button', { text: c || 'All', className: ui.cat === c ? 'on' : '' });
      b.addEventListener('click', function () { ui.cat = c; drawChips(); draw(); });
      chipBox.appendChild(b);
    });
  };
  var draw = function () {
    out.innerHTML = '';
    if (!st.inv) { count.textContent = ''; return out.appendChild(el('div', { className: 'foot', text: 'Loading inventory...' })); }
    var found = searchRows_(st.inv, ui.query, 100000).filter(function (r) { return !ui.cat || r.category === ui.cat; });
    var hits = sortRows_(found, ui.sort, ui.dir).slice(0, 100);
    count.textContent = (found.length > hits.length ? hits.length + ' of ' + found.length : String(found.length)) + ' result(s)';
    if (!hits.length) return out.appendChild(el('div', { className: 'foot', text: 'Nothing matched.' }));
    out.appendChild(el('div', { className: 'group' }, hits.map(function (x) {
      return el('div', { className: 'item' }, [
        el('div', { className: 'res' }, [el('span', { className: 'big', text: [x.value, x.package].filter(Boolean).join(' ') || x.mpns.split(', ')[0] }), el('span', { className: 'qty', text: String(x.qty) })]),
        el('div', { className: 'sub', text: [x.category, x.spec, x.location && ('@ ' + x.location)].filter(Boolean).join(' · ') }),
        el('div', { text: x.description }),
        el('div', { className: 'small', text: x.mpns })
      ]);
    })));
  };
  var sortSel = el('select', {}, [['', 'Sort: relevance'], ['category', 'Category'], ['value', 'Value'], ['package', 'Package'], ['qty', 'Quantity'], ['location', 'Location'], ['part', 'Part number'], ['updated', 'Updated']].map(function (o) { return el('option', { value: o[0], text: o[1], selected: o[0] === ui.sort }); }));
  sortSel.addEventListener('change', function () { ui.sort = sortSel.value; draw(); });
  var dirBtn = el('button', { className: 'pill', text: ui.dir === 'desc' ? 'Descending' : 'Ascending' });
  dirBtn.addEventListener('click', function () { ui.dir = ui.dir === 'desc' ? 'asc' : 'desc'; dirBtn.textContent = ui.dir === 'desc' ? 'Descending' : 'Ascending'; draw(); });
  var box = el('input', { value: ui.query, placeholder: 'Search 0402 20k, X7R, part number...', type: 'text' });
  box.setAttribute('autocapitalize', 'off'); box.setAttribute('autocorrect', 'off'); box.setAttribute('enterkeyhint', 'search');
  var clear = el('button', { text: '\u00d7' }); clear.setAttribute('aria-label', 'Clear');
  clear.style.display = ui.query ? 'block' : 'none';
  box.addEventListener('input', function () { ui.query = box.value; clear.style.display = box.value ? 'block' : 'none'; draw(); });   // redraws only the results, so the phone keyboard stays open
  clear.addEventListener('click', function () { box.value = ''; ui.query = ''; clear.style.display = 'none'; draw(); });
  var mag = el('div', {}); mag.innerHTML = '<svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4"/></svg>';
  root.appendChild(el('div', { className: 'search' }, [mag.firstChild, box, clear]));
  drawChips(); root.appendChild(chipBox);
  root.appendChild(el('div', { className: 'bar' }, [count, sortSel, dirBtn]));
  draw();
  root.appendChild(out);
  return root;
}

function render() {
  t1.className = tab === 'add' ? 'on' : ''; t2.className = tab === 'search' ? 'on' : '';
  var app = document.getElementById('app');
  app.innerHTML = '';
  if (signedIn()) app.appendChild(el('div', { className: 'title', text: tab === 'add' ? 'Add stock' : 'Search' }));
  if (st.msg) app.appendChild(el('div', { className: 'card ' + (/^Error|not found|No barcode/.test(st.msg) ? 'bad' : 'good'), text: st.msg }));
  if (!signedIn()) return app.appendChild(loginView());
  app.appendChild(tab === 'add' ? addView() : searchView());
}
var t1 = document.getElementById('t1'), t2 = document.getElementById('t2');
st.inv = signedIn() && store('inv') || null;
loadInv();
t1.onclick = function () { tab = 'add'; render(); };
t2.onclick = function () { tab = 'search'; render(); };
render();
</script>
</body>
</html>
